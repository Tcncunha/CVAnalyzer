name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PYTHONPATH: src

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify modules compile
        run: python -m compileall -q src

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke-check app entrypoint imports (app, ui, cv_builder)
        run: python -c "import sys; sys.path.insert(0, 'src'); import app, ui, cv_builder; print('app import OK')"

      - name: Verify banner asset is shipped
        run: python -c "import os; p=os.path.join('src', 'img', 'MainBanner.png'); assert os.path.isfile(p), 'MainBanner.png missing'; assert open(p, 'rb').read(8) == b'\x89PNG\r\n\x1a\n', 'not a PNG'; print('banner OK:', os.path.getsize(p), 'bytes')"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only — no registry push, no secrets required.
      # To publish, uncomment the "push" option and configure a registry
      # (e.g. GHCR packages: docker/login-action with secrets.GITHUB_TOKEN).
      - name: Build image with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: cv-analyzer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot container and run healthcheck smoke test
        run: |
          docker run -d --name cv-analyzer-smoke -p 8501:8501 cv-analyzer:${{ github.sha }}
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Streamlit health endpoint not ready"
            docker logs cv-analyzer-smoke
            docker rm -f cv-analyzer-smoke
            exit 1
          fi
          echo "Health endpoint OK"

      - name: Verify runtime assets (banner) and stop container
        run: |
          docker exec cv-analyzer-smoke test -f /app/src/img/MainBanner.png \
            && echo "MainBanner.png present in image" \
            || { echo "::error::MainBanner.png missing in image"; docker rm -f cv-analyzer-smoke; exit 1; }
          docker rm -f cv-analyzer-smoke